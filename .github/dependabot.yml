version: 2
updates:
  # 1. Automatically monitors your GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/" # Required mapping for workflow file tracking
    schedule:
      interval: "weekly"
    groups:
      action-updates:
        patterns:
          - "*"
    # Wait 7 days before proposing updates to prevent malicious/unstable packages
    cooldown:
      default-days: 7

  # 2. Automatically monitors Python dependencies
  - package-ecosystem: "pip"
    directory: "/" # Looks for requirements.txt or pyproject.toml in the root
    schedule:
      interval: "weekly"
    groups:
      python-updates:
        patterns:
          - "*"
    # Wait 7 days before proposing updates to prevent malicious/unstable packages
    cooldown:
      default-days: 7

  # 3. Automatically monitors Docker base images used in your workflows
  - package-ecosystem: "docker"
    directory: "/build" # Tracks build/Dockerfile
    schedule:
      interval: "weekly"
    groups:
      docker-updates:
        patterns:
          - "*"
    # Wait 7 days before proposing updates to prevent malicious/unstable packages
    cooldown:
      default-days: 7
