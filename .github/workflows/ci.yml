name: w2c-letsencrypt-esxi

# Make repo-wide default permissions explicit and minimal
permissions:
  contents: read

on:
  push:
    branches:
      - '*'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Test Python syntax
        run: |
          python3 -m py_compile acme_tiny.py
          echo "✓ Python syntax validation passed"

      - name: Test shell script syntax
        run: |
          bash -n renew.sh
          bash -n dnsapi/dns_api.sh
          # Test all DNS provider scripts
          for dns_script in dnsapi/dns_*.sh; do
            if [ "$dns_script" != "dnsapi/dns_api.sh" ] && [ -f "$dns_script" ]; then
              echo "Testing syntax: $dns_script"
              bash -n "$dns_script"
            fi
          done
          echo "✓ Shell script syntax validation passed"

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Create VIB
        run: /bin/bash ./build/build.sh

      - name: Store VIB
        uses: actions/upload-artifact@v7.0.1
        with:
          name: $VIB_NAME
          path: |
            artifacts/$VIB_OUTPUT
            artifacts/$OFFLINE_BUNDLE_NAME
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Retrieve build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: $VIB_NAME
          path: artifacts

      - name: Generate installation notes
        run: |
          cat > installation_notes.md << EOF
          ## 📦 Installation

          \`\`\`bash
          wget -O /tmp/$VIB_OUTPUT https://github.com/${{ github.repository }}/releases/download/$VIB_TAG/$VIB_OUTPUT
          esxcli software vib install -v /tmp/$VIB_OUTPUT -f --no-sig-check
          \`\`\`

          See the [README](https://github.com/${{ github.repository }}/blob/master/README.md) for configuration and usage instructions.
          EOF

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body: $VIB_NAME
          files: |
            artifacts/$VIB_OUTPUT
            artifacts/$OFFLINE_BUNDLE_NAME
